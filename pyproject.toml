[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qrcfit"
version = "0.1.0"
description = "Map of where quantum reservoir computing beats tuned classical baselines in accuracy and shot/compute scaling"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.12", "matplotlib>=3.8"]
license = {text = "MIT"}
authors = [{name = "Hikaru Wakaura"}]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["qrcfit*"]
